name: Run Sipfront Call Test

on: [ push, pull_request, workflow_dispatch ]

jobs:
  sipfront-call-test:
    name: Validate, build, deploy and test end to end call
    runs-on: ubuntu-latest
    steps:

      # First, checkout the code
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      # Your pre-requisites steps go here to
      # * format and lint your code,
      # * build, push and deploy docker image to test system:
      #   https://docs.github.com/en/actions/deployment/deploying-to-your-cloud-provider/deploying-to-amazon-elastic-container-service

      # Then, trigger the test run:
      # Pinned to a commit on action-call-test master while we iterate; bump
      # this SHA whenever the action logic changes (tag a release once stable).
      - name: Check basic end-to-end call from A to B
        id: testcall-1
        uses: sipfront/action-call-test@d5cce5b9876a0bdf69642560d8e317f6b2309402
        with:
          public_key: '${{ secrets.SIPFRONT_PUBLIC_KEY_DEV }}'
          secret_key: '${{ secrets.SIPFRONT_SECRET_KEY_DEV }}'
          name: 'basic-call-a-b'
          # Run against the dev infrastructure (https://app.dev.sipfront.com)
          sf_environment: 'dev'
          # Make report_url point to the kiosk (fullscreen) version of the report
          report_mode: 'kiosk'

      # Print the report link whether the call test passed or failed. The action
      # sets its outputs before failing, so report_url is available either way.
      - name: Report for A-to-B call test
        if: ${{ always() && steps.testcall-1.outputs.report_url != '' }}
        run: |
          echo "A-to-B status: ${{ steps.testcall-1.outputs.status }}"
          echo "A-to-B report: ${{ steps.testcall-1.outputs.report_url }}"
          {
            echo "### A-to-B call test: ${{ steps.testcall-1.outputs.status }}"
            echo "[View report](${{ steps.testcall-1.outputs.report_url }}) — session \`${{ steps.testcall-1.outputs.session_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Then, trigger the test run. Run it even if the previous test failed
      # (but not if the workflow was cancelled); the job still fails overall if
      # any test fails.
      - name: Check if DTMF is working
        id: testcall-2
        if: ${{ !cancelled() }}
        uses: sipfront/action-call-test@d5cce5b9876a0bdf69642560d8e317f6b2309402
        with:
          public_key: '${{ secrets.SIPFRONT_PUBLIC_KEY_DEV }}'
          secret_key: '${{ secrets.SIPFRONT_SECRET_KEY_DEV }}'
          name: 'validate-dtmf'
          # Run against the dev infrastructure (https://app.dev.sipfront.com)
          sf_environment: 'dev'
          # Make report_url point to the kiosk (fullscreen) version of the report
          report_mode: 'kiosk'

      - name: Report for DTMF call test
        if: ${{ always() && steps.testcall-2.outputs.report_url != '' }}
        run: |
          echo "DTMF status: ${{ steps.testcall-2.outputs.status }}"
          echo "DTMF report: ${{ steps.testcall-2.outputs.report_url }}"
          {
            echo "### DTMF call test: ${{ steps.testcall-2.outputs.status }}"
            echo "[View report](${{ steps.testcall-2.outputs.report_url }}) — session \`${{ steps.testcall-2.outputs.session_id }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Then, run a whole project (all tests in the project) by name, even if
      # an earlier test failed (but not if the workflow was cancelled):
      - name: Run the "Demo Project" project
        id: projectrun-1
        if: ${{ !cancelled() }}
        uses: sipfront/action-call-test@d5cce5b9876a0bdf69642560d8e317f6b2309402
        with:
          public_key: '${{ secrets.SIPFRONT_PUBLIC_KEY_DEV }}'
          secret_key: '${{ secrets.SIPFRONT_SECRET_KEY_DEV }}'
          mode: 'project'
          project_name: 'Demo Project'
          # Run against the dev infrastructure (https://app.dev.sipfront.com)
          sf_environment: 'dev'

      - name: Report for Demo Project run
        if: ${{ always() && steps.projectrun-1.outputs.report_url != '' }}
        run: |
          echo "Demo Project status: ${{ steps.projectrun-1.outputs.status }}"
          echo "Demo Project report: ${{ steps.projectrun-1.outputs.report_url }}"
          {
            echo "### Demo Project run: ${{ steps.projectrun-1.outputs.status }}"
            echo "[View report](${{ steps.projectrun-1.outputs.report_url }}) — project run \`${{ steps.projectrun-1.outputs.project_run_uuid }}\` (${{ steps.projectrun-1.outputs.tests_started }}/${{ steps.projectrun-1.outputs.total_tests }} tests)"
          } >> "$GITHUB_STEP_SUMMARY"
